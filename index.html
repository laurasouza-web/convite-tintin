<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tintin Story</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    .convite {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .botao {
      position: absolute;
      width: 70px;
      height: 70px;
      cursor: pointer;
      z-index: 10;
    }

    /* POSIÇÃO DO PRESENTE 🎁 */
    .presente {
      left: 38%;
      top: 70%;
    }

    /* POSIÇÃO DO CORAÇÃO ❤️ */
    .coracao {
      left: 55%;
      top: 70%;
    }

    .botao img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div class="convite">

    <video controls autoplay>
      <source src="convite.mp4" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>

    <!-- BOTÃO PRESENTE -->
    <a href="https://canva.link/p4frhvmsusia8hv"
       target="_blank"
       class="botao presente">

      🎁

    </a>

    <!-- BOTÃO CONFIRMAR PRESENÇA -->
    <a href="https://wa.me/5535984690628?text=Amigo%20estou%20aqui%20%F0%9F%92%9B%E2%9C%A8"
       target="_blank"
       class="botao coracao">

      ❤️

    </a>

  </div>

</body>
</html>
